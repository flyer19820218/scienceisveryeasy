<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme: light;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <title>科學大聯盟：素養導向學習平台</title>
  
  <meta name="apple-mobile-web-app-title" content="科學大聯盟">
  <meta name="application-name" content="科學大聯盟">

  <link rel="apple-touch-icon" href="https://github.com/flyer19820218/scienceisveryeasy/blob/main/diagnosis.png?raw=true">
  <link rel="icon" sizes="192x192" href="https://github.com/flyer19820218/scienceisveryeasy/blob/main/diagnosis.png?raw=true">
  <link rel="shortcut icon" href="https://github.com/flyer19820218/scienceisveryeasy/blob/main/diagnosis.png?raw=true">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <style>
    /* 核心重置，確保手機瀏覽器不留白邊 */
    html, body { 
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; 
      background-color: #FFFFFF; font-family: "HanziPen SC", sans-serif;
      -webkit-text-size-adjust: 100%; 
    }
    
    /* 建立滿版外框，支援 iOS 平滑滾動 */
    .iframe-wrapper {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh; overflow: hidden;
      -webkit-overflow-scrolling: touch; 
    }
    
    /* 讓 iframe 填滿外框，氣球會出現在最底部的 45px 區域內 */
    iframe { 
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh; 
      border: none; margin: 0; padding: 0;
    }
    
    /* 【終極遮蔽條】高度提升至 45px，確保徹底壓死 Streamlit 氣球浮水印 */
    .dummy-footer {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 45px; 
      background-color: #FFFFFF; z-index: 9999; border-top: 1px solid #e7ebf3; 
    }
  </style>
</head>
<body>
  
  <div class="iframe-wrapper">
    <iframe src="https://scienceisveryeasy-diag.streamlit.app/?embed=true" scrolling="yes"></iframe>
  </div>
  
  <div class="dummy-footer"></div>

</body>
</html>
